components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token

  schemas:
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Client UUID
        user_id:
          type: string
          format: uuid
          description: User UUID (linked to users table)
        organization_id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        phone:
          type: string
          nullable: true
        first_name:
          type: string
          description: First name (from users table)
        last_name:
          type: string
          description: Last name (from users table)
        full_name:
          type: string
          description: Full name (from users table)
        email:
          type: string
          description: Email (from users table)
        client_type:
          type: string
          enum: [Individual, Family, Business, Rescue, Breeder]
          nullable: true
        account_source:
          type: string
          enum: [Walk-in, Referral, Online, Phone, Social Media, Advertisement]
          nullable: true
        status:
          type: string
          example: "active"
        created_at:
          type: string
          format: date-time
        clinic_name:
          type: string
          example: "Springfield Veterinary Clinic"
        pet_names:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string

    CreateClientRequest:
      type: object
      required:
        - organization_id
        - clinic_id
      properties:
        organization_id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        gender:
          type: string
          enum: [Male, Female, Non-binary, Prefer not to say]
        client_type:
          type: string
          enum: [Individual, Family, Business, Rescue, Breeder]
        address_street:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
        account_source:
          type: string
          enum: [Walk-in, Referral, Online, Phone, Social Media, Advertisement]
        comm_preferred_contact_method:
          type: string
          enum: [Email, Phone, SMS, Mail]
        comm_email_ok:
          type: boolean
        comm_phone_ok:
          type: boolean
        comm_sms_ok:
          type: boolean
        comm_mail_ok:
          type: boolean

    UpdateClientRequest:
      type: object
      properties:
        phone:
          type: string
        address_street:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
        comm_sms_ok:
          type: boolean

    ClientNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pet:
      type: object
      properties:
        id:
